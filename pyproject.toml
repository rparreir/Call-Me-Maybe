[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Program to turn natural language prompts into JSON function calls."
readme = "README.md"
authors = [
    { name = "Ruben", email = "rparreir@student.42lisboa.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "llm_sdk"
]

[tool.uv.sources]
llm_sdk = { path = "./llm_sdk", editable = true }

[tool.mypy]
namespace_packages = false

[[tool.mypy.overrides]]
module = ["llm_sdk", "llm_sdk.*"]
ignore_missing_imports = true